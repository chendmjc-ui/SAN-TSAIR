<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="匾額獎牌類商品示意圖">
  <rect width="800" height="600" fill="#FAF8F5"/>

  <!-- 底座陰影 -->
  <ellipse cx="400" cy="470" rx="220" ry="18" fill="#B45309" opacity="0.08"/>

  <!-- 匾額主體 -->
  <g>
    <rect x="220" y="140" width="360" height="260" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
    <rect x="238" y="158" width="324" height="224" rx="6" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>

    <!-- 桂冠 -->
    <g stroke="#B45309" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M400 200 C 360 210, 340 250, 350 300"/>
      <path d="M400 200 C 440 210, 460 250, 450 300"/>
      <path d="M355 215 l-14 -8 M348 235 l-16 -4 M347 258 l-16 2 M350 280 l-14 10"/>
      <path d="M445 215 l14 -8 M452 235 l16 -4 M453 258 l16 2 M450 280 l14 10"/>
    </g>

    <!-- 星形獎章 -->
    <path d="M400 220 l10.5 21.5 23.7 3.5 -17.1 16.7 4 23.6 -21.1 -11.1 -21.1 11.1 4 -23.6 -17.1 -16.7 23.7 -3.5 Z"
          fill="#D97706"/>

    <!-- 文字橫線示意（代表刻字內容，非真實文字） -->
    <rect x="330" y="300" width="140" height="10" rx="5" fill="#B45309" opacity="0.55"/>
    <rect x="350" y="322" width="100" height="8" rx="4" fill="#D97706" opacity="0.4"/>
  </g>

  <!-- 底座 -->
  <path d="M330 400 L 470 400 L 486 430 L 314 430 Z" fill="#B45309"/>
  <rect x="300" y="430" width="200" height="14" rx="4" fill="#8a3d06"/>

  <!-- 標示：示意圖非實際商品 -->
  <text x="400" y="480" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#B45309" font-weight="600">匾額 ・ 獎牌類</text>
  <text x="400" y="504" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#92702a">示意圖，非實際商品外觀，實品規格請洽詢</text>
</svg>
